<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 291" role="img" class="dg">
  <title>Example 2 - two paths from one stream</title><desc>A speed path serves approximate live counters while a batch path produces the correct daily numbers</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">Example 2 - two paths from one stream</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box dg-box-accent" x="16" y="16" width="354" height="220.95" rx="10" ry="10"/>
  <text class="dg-label" x="193" y="49.1" font-size="16" text-anchor="middle" font-weight="500">Speed path</text>
  <circle class="dg-dot" cx="36" cy="78.7" r="2.5"/>
  <text class="dg-sub" x="48" y="81.5" font-size="12.5" text-anchor="start">Reads: Kafka, 5-minute windows</text>
  <circle class="dg-dot" cx="36" cy="105.8" r="2.5"/>
  <text class="dg-sub" x="48" y="108.6" font-size="12.5" text-anchor="start">Writes: counters into Redis</text>
  <circle class="dg-dot" cx="36" cy="132.9" r="2.5"/>
  <text class="dg-sub" x="48" y="135.7" font-size="12.5" text-anchor="start">Serves: the live launch dashboard</text>
  <circle class="dg-dot" cx="36" cy="160.1" r="2.5"/>
  <text class="dg-sub" x="48" y="162.8" font-size="12.5" text-anchor="start">Late data: dropped past the watermark</text>
  <circle class="dg-dot" cx="36" cy="187.2" r="2.5"/>
  <text class="dg-sub" x="48" y="189.9" font-size="12.5" text-anchor="start">Promise: approximate, and labelled as such</text>
  <rect class="dg-box dg-box-muted" x="390" y="16" width="354" height="220.95" rx="10" ry="10"/>
  <text class="dg-label" x="567" y="49.1" font-size="16" text-anchor="middle" font-weight="500">Truth path</text>
  <circle class="dg-dot" cx="410" cy="78.7" r="2.5"/>
  <text class="dg-sub" x="422" y="81.5" font-size="12.5" text-anchor="start">Reads: Parquet landed from the same Kafka</text>
  <text class="dg-sub" x="422" y="99.6" font-size="12.5" text-anchor="start">topic</text>
  <circle class="dg-dot" cx="410" cy="124.0" r="2.5"/>
  <text class="dg-sub" x="422" y="126.7" font-size="12.5" text-anchor="start">Writes: fct_events, sessions, funnels</text>
  <circle class="dg-dot" cx="410" cy="151.1" r="2.5"/>
  <text class="dg-sub" x="422" y="153.8" font-size="12.5" text-anchor="start">Serves: product analytics and reporting</text>
  <circle class="dg-dot" cx="410" cy="178.2" r="2.5"/>
  <text class="dg-sub" x="422" y="180.9" font-size="12.5" text-anchor="start">Late data: 7-day lookback re-run every night</text>
  <circle class="dg-dot" cx="410" cy="205.3" r="2.5"/>
  <text class="dg-sub" x="422" y="208.1" font-size="12.5" text-anchor="start">Promise: correct, and up to a day old</text>
  </g>
</svg>
