<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 807" role="img" class="dg">
  <title>Eight steps, in this order</title><desc>Clarify the consumer, get numbers, sketch the flow, choose ingestion, storage, processing, then failure modes and operations</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">Eight steps, in this order</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box" x="16" y="16" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="40.3" font-size="15" text-anchor="start" font-weight="500">1. Who uses it</text>
  <text class="dg-sub" x="34" y="62.0" font-size="12.5" text-anchor="start">Name the person and the decision they make</text>
  <line class="dg-arrow" x1="380" y1="87.875" x2="380" y2="104.875" marker-end="url(#dg-a)"/>
  <rect class="dg-box dg-box-accent" x="16" y="111.875" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="136.2" font-size="15" text-anchor="start" font-weight="500">2. Get numbers</text>
  <text class="dg-sub" x="34" y="157.9" font-size="12.5" text-anchor="start">Volume, growth, freshness, budget - never adjectives</text>
  <line class="dg-arrow" x1="380" y1="183.75" x2="380" y2="200.75" marker-end="url(#dg-a)"/>
  <rect class="dg-box" x="16" y="207.75" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="232.1" font-size="15" text-anchor="start" font-weight="500">3. Sketch the flow</text>
  <text class="dg-sub" x="34" y="253.8" font-size="12.5" text-anchor="start">The five boxes, agreed before any tool is named</text>
  <line class="dg-arrow" x1="380" y1="279.625" x2="380" y2="296.625" marker-end="url(#dg-a)"/>
  <rect class="dg-box" x="16" y="303.625" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="327.9" font-size="15" text-anchor="start" font-weight="500">4. Choose ingestion</text>
  <text class="dg-sub" x="34" y="349.6" font-size="12.5" text-anchor="start">Per source: snapshot, incremental, CDC, events, files</text>
  <line class="dg-arrow" x1="380" y1="375.5" x2="380" y2="392.5" marker-end="url(#dg-a)"/>
  <rect class="dg-box" x="16" y="399.5" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="423.8" font-size="15" text-anchor="start" font-weight="500">5. Choose storage</text>
  <text class="dg-sub" x="34" y="445.5" font-size="12.5" text-anchor="start">Warehouse or lakehouse, format, partition key</text>
  <line class="dg-arrow" x1="380" y1="471.375" x2="380" y2="488.375" marker-end="url(#dg-a)"/>
  <rect class="dg-box" x="16" y="495.375" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="519.7" font-size="15" text-anchor="start" font-weight="500">6. Choose processing</text>
  <text class="dg-sub" x="34" y="541.4" font-size="12.5" text-anchor="start">Batch or stream, full or incremental, the schedule</text>
  <line class="dg-arrow" x1="380" y1="567.25" x2="380" y2="584.25" marker-end="url(#dg-a)"/>
  <rect class="dg-box dg-box-accent" x="16" y="591.25" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="615.5" font-size="15" text-anchor="start" font-weight="500">7. Break it on purpose</text>
  <text class="dg-sub" x="34" y="637.3" font-size="12.5" text-anchor="start">Walk through every failure mode out loud</text>
  <line class="dg-arrow" x1="380" y1="663.125" x2="380" y2="680.125" marker-end="url(#dg-a)"/>
  <rect class="dg-box" x="16" y="687.125" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="711.4" font-size="15" text-anchor="start" font-weight="500">8. Operate it</text>
  <text class="dg-sub" x="34" y="733.1" font-size="12.5" text-anchor="start">Tests, alerts, ownership, runbook, cost estimate</text>
  </g>
</svg>
