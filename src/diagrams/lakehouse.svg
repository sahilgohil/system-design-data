<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 377" role="img" class="dg">
  <title>What a lakehouse actually stacks up</title><desc>Query engines on top, table format metadata below, Parquet files below that, object storage at the base</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">What a lakehouse actually stacks up</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box dg-box-accent" x="16" y="16" width="502" height="67.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="41.3" font-size="15" text-anchor="start" font-weight="500">Query engines</text>
  <text class="dg-sub" x="34" y="63.0" font-size="12.5" text-anchor="start">Spark, Trino, DuckDB, warehouses</text>
  <text class="dg-sub" x="534" y="42.1" font-size="12.5" text-anchor="start">Several can read the same</text>
  <text class="dg-sub" x="534" y="60.2" font-size="12.5" text-anchor="start">table.</text>
  <rect class="dg-box" x="16" y="95.875" width="502" height="67.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="121.2" font-size="15" text-anchor="start" font-weight="500">Table format</text>
  <text class="dg-sub" x="34" y="142.9" font-size="12.5" text-anchor="start">Iceberg, Delta Lake, Hudi</text>
  <text class="dg-sub" x="534" y="121.9" font-size="12.5" text-anchor="start">Adds transactions, updates,</text>
  <text class="dg-sub" x="534" y="140.1" font-size="12.5" text-anchor="start">time travel.</text>
  <rect class="dg-box" x="16" y="175.75" width="502" height="67.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="201.1" font-size="15" text-anchor="start" font-weight="500">File format</text>
  <text class="dg-sub" x="34" y="222.8" font-size="12.5" text-anchor="start">Parquet files</text>
  <text class="dg-sub" x="534" y="201.8" font-size="12.5" text-anchor="start">Columnar, compressed,</text>
  <text class="dg-sub" x="534" y="219.9" font-size="12.5" text-anchor="start">self-describing.</text>
  <rect class="dg-box" x="16" y="255.625" width="502" height="67.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="280.9" font-size="15" text-anchor="start" font-weight="500">Object storage</text>
  <text class="dg-sub" x="34" y="302.6" font-size="12.5" text-anchor="start">S3, GCS, ADLS</text>
  <text class="dg-sub" x="534" y="281.7" font-size="12.5" text-anchor="start">Cheap, durable, no compute of</text>
  <text class="dg-sub" x="534" y="299.8" font-size="12.5" text-anchor="start">its own.</text>
  </g>
</svg>
