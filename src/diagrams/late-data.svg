<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 206" role="img" class="dg">
  <title>A phone goes offline on Monday night</title><desc>An event happens Monday, the device is offline until Thursday, and Monday's total was already written on Tuesday</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">A phone goes offline on Monday night</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box dg-box-accent" x="16" y="46" width="128.36363636363637" height="44" rx="10" ry="10"/>
  <text class="dg-label" x="80.18181818181819" y="69.8" font-size="15" text-anchor="middle" font-weight="500">Mon 23:58</text>
  <text class="dg-sub" x="80.18181818181819" y="110.3" font-size="12.5" text-anchor="middle">purchase happens ·</text>
  <text class="dg-sub" x="80.18181818181819" y="128.4" font-size="12.5" text-anchor="middle">event_time</text>
  <rect class="dg-box dg-box-muted" x="148.36363636363637" y="46" width="260.72727272727275" height="44" rx="10" ry="10"/>
  <text class="dg-label" x="278.72727272727275" y="69.8" font-size="15" text-anchor="middle" font-weight="500">Tue-Wed</text>
  <text class="dg-sub" x="278.72727272727275" y="110.3" font-size="12.5" text-anchor="middle">device offline · nothing arrives</text>
  <rect class="dg-box" x="413.0909090909091" y="46" width="194.54545454545453" height="44" rx="10" ry="10"/>
  <text class="dg-label" x="510.3636363636364" y="69.8" font-size="15" text-anchor="middle" font-weight="500">Tue 02:00</text>
  <text class="dg-sub" x="510.3636363636364" y="110.3" font-size="12.5" text-anchor="middle">Monday's total is written ·</text>
  <text class="dg-sub" x="510.3636363636364" y="128.4" font-size="12.5" text-anchor="middle">already wrong</text>
  <rect class="dg-box" x="611.6363636363636" y="46" width="132.36363636363637" height="44" rx="10" ry="10"/>
  <text class="dg-label" x="675.8181818181818" y="69.8" font-size="15" text-anchor="middle" font-weight="500">Thu 09:14</text>
  <text class="dg-sub" x="675.8181818181818" y="110.3" font-size="12.5" text-anchor="middle">event finally</text>
  <text class="dg-sub" x="675.8181818181818" y="128.4" font-size="12.5" text-anchor="middle">arrives ·</text>
  <text class="dg-sub" x="675.8181818181818" y="146.5" font-size="12.5" text-anchor="middle">ingested_at</text>
  <text class="dg-sub" x="16" y="30.3" font-size="12.5" text-anchor="start">Time →</text>
  </g>
</svg>
