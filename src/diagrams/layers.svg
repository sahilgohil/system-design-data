<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 297" role="img" class="dg">
  <title>The three layers, top to bottom</title><desc>Marts read from staging, staging reads from raw, raw is never edited</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">The three layers, top to bottom</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box dg-box-accent" x="16" y="16" width="502" height="67.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="41.3" font-size="15" text-anchor="start" font-weight="500">Marts · gold</text>
  <text class="dg-sub" x="34" y="63.0" font-size="12.5" text-anchor="start">Star schemas, metrics, business names</text>
  <text class="dg-sub" x="534" y="33.0" font-size="12.5" text-anchor="start">What people actually query.</text>
  <text class="dg-sub" x="534" y="51.1" font-size="12.5" text-anchor="start">Business logic lives here,</text>
  <text class="dg-sub" x="534" y="69.3" font-size="12.5" text-anchor="start">once.</text>
  <rect class="dg-box" x="16" y="95.875" width="502" height="67.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="121.2" font-size="15" text-anchor="start" font-weight="500">Staging · silver</text>
  <text class="dg-sub" x="34" y="142.9" font-size="12.5" text-anchor="start">Typed, deduplicated, one row per real thing</text>
  <text class="dg-sub" x="534" y="121.9" font-size="12.5" text-anchor="start">Reads only from raw. No</text>
  <text class="dg-sub" x="534" y="140.1" font-size="12.5" text-anchor="start">business opinions yet.</text>
  <rect class="dg-box" x="16" y="175.75" width="502" height="67.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="201.1" font-size="15" text-anchor="start" font-weight="500">Raw · bronze</text>
  <text class="dg-sub" x="34" y="222.8" font-size="12.5" text-anchor="start">Exactly what the source said, append-only</text>
  <text class="dg-sub" x="534" y="201.8" font-size="12.5" text-anchor="start">Never edited. This is your</text>
  <text class="dg-sub" x="534" y="219.9" font-size="12.5" text-anchor="start">ability to rebuild everything.</text>
  </g>
</svg>
