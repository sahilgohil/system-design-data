<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 273" role="img" class="dg">
  <title>The two kinds of database</title><desc>OLTP is row-oriented and serves small fast requests; OLAP is column-oriented and serves large scans</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">The two kinds of database</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box dg-box-muted" x="16" y="16" width="354" height="202.825" rx="10" ry="10"/>
  <text class="dg-label" x="193" y="49.1" font-size="16" text-anchor="middle" font-weight="500">OLTP · your app's database</text>
  <circle class="dg-dot" cx="36" cy="78.7" r="2.5"/>
  <text class="dg-sub" x="48" y="81.5" font-size="12.5" text-anchor="start">Question: get order #4521</text>
  <circle class="dg-dot" cx="36" cy="105.8" r="2.5"/>
  <text class="dg-sub" x="48" y="108.6" font-size="12.5" text-anchor="start">Touches 1 row, all 200 columns</text>
  <circle class="dg-dot" cx="36" cy="132.9" r="2.5"/>
  <text class="dg-sub" x="48" y="135.7" font-size="12.5" text-anchor="start">Row-oriented on disk</text>
  <circle class="dg-dot" cx="36" cy="160.1" r="2.5"/>
  <text class="dg-sub" x="48" y="162.8" font-size="12.5" text-anchor="start">Optimised for latency per request</text>
  <circle class="dg-dot" cx="36" cy="187.2" r="2.5"/>
  <text class="dg-sub" x="48" y="189.9" font-size="12.5" text-anchor="start">Postgres, MySQL, DynamoDB</text>
  <rect class="dg-box dg-box-accent" x="390" y="16" width="354" height="202.825" rx="10" ry="10"/>
  <text class="dg-label" x="567" y="49.1" font-size="16" text-anchor="middle" font-weight="500">OLAP · your analytics database</text>
  <circle class="dg-dot" cx="410" cy="78.7" r="2.5"/>
  <text class="dg-sub" x="422" y="81.5" font-size="12.5" text-anchor="start">Question: revenue by region, 3 years</text>
  <circle class="dg-dot" cx="410" cy="105.8" r="2.5"/>
  <text class="dg-sub" x="422" y="108.6" font-size="12.5" text-anchor="start">Touches 1 billion rows, 3 columns</text>
  <circle class="dg-dot" cx="410" cy="132.9" r="2.5"/>
  <text class="dg-sub" x="422" y="135.7" font-size="12.5" text-anchor="start">Column-oriented on disk</text>
  <circle class="dg-dot" cx="410" cy="160.1" r="2.5"/>
  <text class="dg-sub" x="422" y="162.8" font-size="12.5" text-anchor="start">Optimised for throughput per query</text>
  <circle class="dg-dot" cx="410" cy="187.2" r="2.5"/>
  <text class="dg-sub" x="422" y="189.9" font-size="12.5" text-anchor="start">Snowflake, BigQuery, DuckDB</text>
  </g>
</svg>
