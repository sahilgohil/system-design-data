<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 519" role="img" class="dg">
  <title>The reference pipeline</title><desc>Five stages: sources, ingestion, storage, transformation, serving</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">The reference pipeline</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box" x="16" y="16" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="40.3" font-size="15" text-anchor="start" font-weight="500">Sources</text>
  <text class="dg-sub" x="34" y="62.0" font-size="12.5" text-anchor="start">App databases, events, SaaS APIs, file drops</text>
  <line class="dg-arrow" x1="380" y1="87.875" x2="380" y2="104.875" marker-end="url(#dg-a)"/>
  <rect class="dg-box" x="16" y="111.875" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="136.2" font-size="15" text-anchor="start" font-weight="500">Ingestion</text>
  <text class="dg-sub" x="34" y="157.9" font-size="12.5" text-anchor="start">Extract and land the data without changing it</text>
  <line class="dg-arrow" x1="380" y1="183.75" x2="380" y2="200.75" marker-end="url(#dg-a)"/>
  <rect class="dg-box dg-box-accent" x="16" y="207.75" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="232.1" font-size="15" text-anchor="start" font-weight="500">Storage</text>
  <text class="dg-sub" x="34" y="253.8" font-size="12.5" text-anchor="start">Raw, then cleaned, then modelled</text>
  <line class="dg-arrow" x1="380" y1="279.625" x2="380" y2="296.625" marker-end="url(#dg-a)"/>
  <rect class="dg-box" x="16" y="303.625" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="327.9" font-size="15" text-anchor="start" font-weight="500">Transformation</text>
  <text class="dg-sub" x="34" y="349.6" font-size="12.5" text-anchor="start">Clean, join, aggregate into business meaning</text>
  <line class="dg-arrow" x1="380" y1="375.5" x2="380" y2="392.5" marker-end="url(#dg-a)"/>
  <rect class="dg-box" x="16" y="399.5" width="728" height="65.875" rx="10" ry="10"/>
  <text class="dg-label" x="34" y="423.8" font-size="15" text-anchor="start" font-weight="500">Serving</text>
  <text class="dg-sub" x="34" y="445.5" font-size="12.5" text-anchor="start">Dashboards, ML features, APIs, business tools</text>
  </g>
</svg>
