<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 291" role="img" class="dg">
  <title>Why layout decides the bill</title><desc>Row storage keeps a whole record together; column storage keeps each field together</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">Why layout decides the bill</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box dg-box-muted" x="16" y="16" width="354" height="220.95" rx="10" ry="10"/>
  <text class="dg-label" x="193" y="49.1" font-size="16" text-anchor="middle" font-weight="500">Row storage</text>
  <circle class="dg-dot" cx="36" cy="78.7" r="2.5"/>
  <text class="dg-sub" x="48" y="81.5" font-size="12.5" text-anchor="start">Stores: [id, name, city, amount] together</text>
  <circle class="dg-dot" cx="36" cy="105.8" r="2.5"/>
  <text class="dg-sub" x="48" y="108.6" font-size="12.5" text-anchor="start">Reading one whole record: one seek</text>
  <circle class="dg-dot" cx="36" cy="132.9" r="2.5"/>
  <text class="dg-sub" x="48" y="135.7" font-size="12.5" text-anchor="start">Summing one column: reads every column</text>
  <circle class="dg-dot" cx="36" cy="160.1" r="2.5"/>
  <text class="dg-sub" x="48" y="162.8" font-size="12.5" text-anchor="start">Mixed types sit side by side, so compression</text>
  <text class="dg-sub" x="48" y="180.9" font-size="12.5" text-anchor="start">is poor</text>
  <circle class="dg-dot" cx="36" cy="205.3" r="2.5"/>
  <text class="dg-sub" x="48" y="208.1" font-size="12.5" text-anchor="start">Right for apps</text>
  <rect class="dg-box dg-box-accent" x="390" y="16" width="354" height="220.95" rx="10" ry="10"/>
  <text class="dg-label" x="567" y="49.1" font-size="16" text-anchor="middle" font-weight="500">Column storage</text>
  <circle class="dg-dot" cx="410" cy="78.7" r="2.5"/>
  <text class="dg-sub" x="422" y="81.5" font-size="12.5" text-anchor="start">Stores: all ids, then all names, then all</text>
  <text class="dg-sub" x="422" y="99.6" font-size="12.5" text-anchor="start">cities</text>
  <circle class="dg-dot" cx="410" cy="124.0" r="2.5"/>
  <text class="dg-sub" x="422" y="126.7" font-size="12.5" text-anchor="start">Reading one whole record: many seeks</text>
  <circle class="dg-dot" cx="410" cy="151.1" r="2.5"/>
  <text class="dg-sub" x="422" y="153.8" font-size="12.5" text-anchor="start">Summing one column: reads only that column</text>
  <circle class="dg-dot" cx="410" cy="178.2" r="2.5"/>
  <text class="dg-sub" x="422" y="180.9" font-size="12.5" text-anchor="start">Same type repeated, so compression is 5-20x</text>
  <circle class="dg-dot" cx="410" cy="205.3" r="2.5"/>
  <text class="dg-sub" x="422" y="208.1" font-size="12.5" text-anchor="start">Right for analytics</text>
  </g>
</svg>
