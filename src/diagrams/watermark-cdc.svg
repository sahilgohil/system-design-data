<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 309" role="img" class="dg">
  <title>The two ways to pull changes from a database</title><desc>High-water-mark queries the source table; CDC reads the replication log</desc>
  <defs>
    <marker id="dg-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dg-arrowhead"/>
    </marker>
  </defs>
  <text class="dg-label" x="16" y="29.1" font-size="16" text-anchor="start" font-weight="500">The two ways to pull changes from a database</text>
  <g transform="translate(0 37.2)">
  <rect class="dg-box dg-box-muted" x="16" y="16" width="354" height="239.075" rx="10" ry="10"/>
  <text class="dg-label" x="193" y="49.1" font-size="16" text-anchor="middle" font-weight="500">High-water-mark</text>
  <circle class="dg-dot" cx="36" cy="78.7" r="2.5"/>
  <text class="dg-sub" x="48" y="81.5" font-size="12.5" text-anchor="start">Asks: rows WHERE updated_at &gt; last seen</text>
  <circle class="dg-dot" cx="36" cy="105.8" r="2.5"/>
  <text class="dg-sub" x="48" y="108.6" font-size="12.5" text-anchor="start">Deletes: invisible, the row just stops</text>
  <text class="dg-sub" x="48" y="126.7" font-size="12.5" text-anchor="start">changing</text>
  <circle class="dg-dot" cx="36" cy="151.1" r="2.5"/>
  <text class="dg-sub" x="48" y="153.8" font-size="12.5" text-anchor="start">Missed writes: yes, if updated_at is not</text>
  <text class="dg-sub" x="48" y="171.9" font-size="12.5" text-anchor="start">touched</text>
  <circle class="dg-dot" cx="36" cy="196.3" r="2.5"/>
  <text class="dg-sub" x="48" y="199.1" font-size="12.5" text-anchor="start">Load on source: a query every run</text>
  <circle class="dg-dot" cx="36" cy="223.4" r="2.5"/>
  <text class="dg-sub" x="48" y="226.2" font-size="12.5" text-anchor="start">Setup: an afternoon</text>
  <rect class="dg-box dg-box-accent" x="390" y="16" width="354" height="239.075" rx="10" ry="10"/>
  <text class="dg-label" x="567" y="49.1" font-size="16" text-anchor="middle" font-weight="500">Change Data Capture</text>
  <circle class="dg-dot" cx="410" cy="78.7" r="2.5"/>
  <text class="dg-sub" x="422" y="81.5" font-size="12.5" text-anchor="start">Reads: the database's own replication log</text>
  <circle class="dg-dot" cx="410" cy="105.8" r="2.5"/>
  <text class="dg-sub" x="422" y="108.6" font-size="12.5" text-anchor="start">Deletes: captured as delete events</text>
  <circle class="dg-dot" cx="410" cy="132.9" r="2.5"/>
  <text class="dg-sub" x="422" y="135.7" font-size="12.5" text-anchor="start">Missed writes: none, the log has every change</text>
  <circle class="dg-dot" cx="410" cy="160.1" r="2.5"/>
  <text class="dg-sub" x="422" y="162.8" font-size="12.5" text-anchor="start">Load on source: almost none</text>
  <circle class="dg-dot" cx="410" cy="187.2" r="2.5"/>
  <text class="dg-sub" x="422" y="189.9" font-size="12.5" text-anchor="start">Setup: replication access and a running</text>
  <text class="dg-sub" x="422" y="208.1" font-size="12.5" text-anchor="start">connector</text>
  </g>
</svg>
